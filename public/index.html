<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0B0B10" />
    <!-- sizes on the .ico makes Chrome prefer the SVG; ThemeProvider swaps the SVG to match the app theme. -->
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link id="favicon" rel="icon" href="/favicon-dark.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>%WEB_TITLE%</title>
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
        background: #0b0b10;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
    <!-- M00 / W00s splash, shown before the bundle runs; RootLayout fades it out once fonts and saved state are in. -->
    <style id="boot-style">
      #boot {
        position: fixed;
        inset: 0;
        z-index: 1000;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 28px;
        overflow: hidden;
        /* Glows are gradients, not blurred circles: iOS Safari runs out of layer memory on filter: blur
           while the bundle parses and paints the logo and dots over black tiles. */
        background:
          radial-gradient(circle 48vmax at 10vmax 12vmax, rgba(255, 61, 139, 0.5), rgba(255, 61, 139, 0) 100%),
          radial-gradient(circle 42vmax at calc(100% - 9vmax) 35vmax, rgba(124, 92, 255, 0.5), rgba(124, 92, 255, 0) 100%),
          radial-gradient(circle 30vmax at 27vmax calc(100% - 3vmax), rgba(61, 124, 255, 0.3), rgba(61, 124, 255, 0) 100%),
          #0b0b10;
        transition: opacity 0.3s ease;
      }
      #boot.gone { opacity: 0; pointer-events: none; }
      #boot img { width: min(268px, 68vw); height: auto; }
      #boot .light { display: none; }
      #boot .dots { display: flex; gap: 8px; }
      #boot .dots i { width: 8px; height: 8px; border-radius: 50%; background: #d7ff3b; opacity: 0.35; animation: boot-pulse 1.2s ease-in-out infinite; }
      #boot .dots i:nth-child(2) { animation-delay: 0.2s; }
      #boot .dots i:nth-child(3) { animation-delay: 0.4s; }
      @keyframes boot-pulse { 0%, 100% { opacity: 0.35; transform: scale(1); } 40% { opacity: 1; transform: scale(1.15); } }
      html[data-boot="light"] #boot {
        background:
          radial-gradient(circle 48vmax at 10vmax 12vmax, rgba(255, 61, 139, 0.4), rgba(255, 61, 139, 0) 100%),
          radial-gradient(circle 42vmax at calc(100% - 9vmax) 35vmax, rgba(124, 92, 255, 0.4), rgba(124, 92, 255, 0) 100%),
          radial-gradient(circle 30vmax at 27vmax calc(100% - 3vmax), rgba(215, 255, 59, 0.4), rgba(215, 255, 59, 0) 100%),
          #f6f5f1;
      }
      html[data-boot="light"] #boot .dark { display: none; }
      html[data-boot="light"] #boot .light { display: block; }
      @media (min-width: 1024px) { #boot img { width: 350px; } #boot { gap: 32px; } }
      @media (prefers-reduced-motion: reduce) { #boot .dots i { animation: none; opacity: 0.7; } }
    </style>
    <script>
      // The saved theme picks the splash colours (the app defaults to dark); «system» follows the OS.
      try {
        var mode = (JSON.parse(localStorage.getItem('lastminute:state') || '{}').settings || {}).theme || 'dark';
        var light = mode === 'light' || (mode === 'system' && matchMedia('(prefers-color-scheme: light)').matches);
        if (light) document.documentElement.setAttribute('data-boot', 'light');
      } catch (e) {}
    </script>
  </head>

  <body>
    <!-- Use static rendering with Expo Router to support running without JavaScript. -->
    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>
    <div id="boot" aria-hidden="true">
      <img class="dark" src="/splash-logo-dark.png" alt="" />
      <img class="light" src="/splash-logo-light.png" alt="" />
      <div class="dots"><i></i><i></i><i></i></div>
    </div>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>
  </body>
</html>
